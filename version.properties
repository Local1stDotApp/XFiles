# Human-set app version. Bump versionName to cut a new stable release, and raise versionCode in
# the same commit to a number above the current nightly's build number (CI refuses anything
# lower). Otherwise every push just refreshes the rolling prerelease, whose versionCode is this
# one plus the commits since the release. A release tag carries its exact versionCode here,
# which is where F-Droid reads it.
versionName=1.5.0
versionCode=44
