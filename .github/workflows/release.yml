name: Release

# Every push builds a signed APK. If version.properties' versionName already has a stable
# release, this only refreshes the rolling "nightly" prerelease. When versionName is bumped, a new
# stable release is cut. A stable release takes versionCode from version.properties as it stands,
# so anyone building its tag (F-Droid does) gets the same number; each nightly adds the commits
# since that release, so every build outranks the one before it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # GitHub-hosted Ubuntu already has the Android SDK. Public repos are unlimited
    # on standard runners; private Free accounts get 2,000 Linux minutes/month.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release notes are built from git history, which needs the commits and the version tags
          # a shallow clone leaves out.
          fetch-depth: 0

      # gradle/gradle-daemon-jvm.properties pins the daemon to JDK 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Hosted VMs are ephemeral; cache Gradle deps so each run doesn't re-download the world.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Runs before the build because it settles the versionCode (BUILD). Branch / manual test
      # runs decide too, but only main publishes.
      - name: Decide release (stable vs rolling prerelease)
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          CODE=$(sed -n 's/^versionCode=//p' version.properties | tr -d '[:space:]')
          if [ -z "$CODE" ]; then
            echo "::error file=version.properties::version.properties has no versionCode."
            exit 1
          fi
          # Stable release for this versionName already exists? (HTTP 200 vs 404)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}")
          if [ "$STATUS" = "200" ]; then
            BUILD=$((CODE + $(git rev-list --count "v${VERSION}..HEAD")))
            echo "tag=nightly"                                        >> "$GITHUB_OUTPUT"
            echo "name=XFiles ${VERSION} — nightly (build ${BUILD})"  >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                                    >> "$GITHUB_OUTPUT"
            echo "apk=XFiles-nightly.apk"                             >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" != "404" ]; then
            echo "::error::Looking up release v${VERSION} returned HTTP $STATUS."
            exit 1
          else
            BUILD=$CODE
            # The new release has to outrank every nightly before it, or nightly users could not
            # update to it. The newest of those is the previous commit's build.
            PREV=$(git show HEAD^:version.properties 2>/dev/null || true)
            PREV_VERSION=$(printf '%s\n' "$PREV" | sed -n 's/^versionName=//p' | tr -d '[:space:]')
            PREV_CODE=$(printf '%s\n' "$PREV" | sed -n 's/^versionCode=//p' | tr -d '[:space:]')
            if [ -n "$PREV_CODE" ] && git rev-parse -q --verify "refs/tags/v${PREV_VERSION}" > /dev/null; then
              FLOOR=$((PREV_CODE + $(git rev-list --count "v${PREV_VERSION}..HEAD^")))
              if [ "$CODE" -le "$FLOOR" ]; then
                echo "::error file=version.properties::versionCode $CODE must be above $FLOOR, the last nightly's. Set versionCode=$((FLOOR + 1))."
                exit 1
              fi
            fi
            echo "tag=v${VERSION}"                                    >> "$GITHUB_OUTPUT"
            echo "name=XFiles ${VERSION}"                             >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                                   >> "$GITHUB_OUTPUT"
            echo "apk=XFiles-${VERSION}.apk"                          >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"

          # Release notes are every commit since the newest version tag. Cutting a stable release
          # that tag is the previous version; refreshing the nightly it is the current stable — so
          # the list reads as "what this download adds on top of the last release" either way.
          # The version bump itself is dropped: the release already says which version it is.
          SINCE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$SINCE" ]; then RANGE="$SINCE..HEAD"; else RANGE=HEAD; fi
          LOG=$(git log --no-merges --reverse --pretty='format:- %s' "$RANGE" \
            | grep -v '^- Bump version to ' || true)
          {
            echo 'notes<<RELEASE_NOTES'
            if [ -n "$SINCE" ]; then
              echo "### Changes since ${SINCE}"
            else
              echo "### Changes"
            fi
            echo
            if [ -n "$LOG" ]; then
              echo "$LOG"
            else
              echo "- Rebuild only, no source changes."
            fi
            if [ -n "$SINCE" ]; then
              echo
              echo "[Full diff](${{ github.server_url }}/${{ github.repository }}/compare/${SINCE}...${{ github.sha }})"
            fi
            echo RELEASE_NOTES
          } >> "$GITHUB_OUTPUT"

      # The full flavor's APK goes to GitHub Releases for direct download; its AAB is what Google
      # Play accepts (mandatory for new apps since 2021). The fdroid flavor (no junrar, see
      # docs/fdroid.md) is built only so a change that breaks F-Droid's build fails here first.
      - name: Build signed release APKs + AAB
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/release.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleFullRelease :app:bundleFullRelease :app:assembleFdroidRelease
          -PbuildNumber=${{ steps.decide.outputs.build }} --no-daemon

      # Not attached to the public release: the AAB is only useful for a Play upload,
      # and shipping it alongside the APK would just confuse people. Grab it from the
      # run's artifacts when you need to push a Play build.
      - name: Upload AAB as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: XFiles-${{ steps.decide.outputs.build }}-play-bundle
          path: app/build/outputs/bundle/fullRelease/app-full-release.aab
          if-no-files-found: error
          retention-days: 90

      # Branch / manual test runs stop here: artifacts are enough to verify the
      # hosted-runner build. Publishing is main-only so a test cannot overwrite nightly.
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: XFiles-${{ steps.decide.outputs.build }}-apk
          path: app/build/outputs/apk/full/release/app-full-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload F-Droid flavor APK as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: XFiles-${{ steps.decide.outputs.build }}-fdroid-apk
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Rename artifact
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/full/release/app-full-release.apk "${{ steps.decide.outputs.apk }}"

      # GitHub lists /releases by created_at / published_at, not by last update.
      # action-gh-release updates the existing nightly in place, so its July date
      # never moves and a later stable (v1.3.1) stays above it. Delete the release
      # and the tag first; the next step then creates a fresh one that sorts to the top.
      - name: Drop previous nightly
        if: github.ref == 'refs/heads/main' && steps.decide.outputs.prerelease == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          REPO="${{ github.repository }}"
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          ACCEPT="Accept: application/vnd.github+json"
          CODE=$(curl -sS -o "$RUNNER_TEMP/nightly.json" -w '%{http_code}' \
            -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${REPO}/releases/tags/nightly")
          if [ "$CODE" = "200" ]; then
            ID=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' \
              "$RUNNER_TEMP/nightly.json")
            if [ -n "$ID" ]; then
              curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" \
                "https://api.github.com/repos/${REPO}/releases/${ID}"
            fi
          fi
          curl -sS -X DELETE -H "$AUTH" -H "$ACCEPT" \
            -o /dev/null -w '' \
            "https://api.github.com/repos/${REPO}/git/refs/tags/nightly" || true

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.decide.outputs.name }}
          prerelease: ${{ steps.decide.outputs.prerelease }}
          body: |
            XFiles ${{ steps.decide.outputs.version }} · build ${{ steps.decide.outputs.build }} (${{ github.sha }}). Offline, open-source file manager — no network, no telemetry.

            ${{ steps.decide.outputs.notes }}
          files: ${{ steps.decide.outputs.apk }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
