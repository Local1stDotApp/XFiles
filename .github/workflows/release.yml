name: Release

# Every push builds a signed APK. The build number (versionCode) increments each run.
# If version.properties' versionName already has a stable release, this only refreshes the
# rolling "nightly" prerelease. When versionName is bumped, a new stable release is cut.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Persistent self-hosted Mac mini (has the Android SDK).
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release notes are built from git history, which needs the commits and the version tags
          # a shallow clone leaves out.
          fetch-depth: 0

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      # APK goes to GitHub Releases for direct download; AAB is what Google Play accepts
      # (mandatory for new apps since 2021). Both come from the same signed build.
      - name: Build signed release APK + AAB
        env:
          XFILES_KEYSTORE: ${{ runner.temp }}/release.jks
          XFILES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          XFILES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          XFILES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      # Not attached to the public release: the AAB is only useful for a Play upload,
      # and shipping it alongside the APK would just confuse people. Grab it from the
      # run's artifacts when you need to push a Play build.
      - name: Upload AAB as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: XFiles-${{ github.run_number }}-play-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Decide release (stable vs rolling prerelease)
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')
          BUILD=${{ github.run_number }}
          # Stable release for this versionName already exists? (HTTP 200 vs 404)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "tag=nightly"                                        >> "$GITHUB_OUTPUT"
            echo "name=XFiles ${VERSION} — nightly (build ${BUILD})"  >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                                    >> "$GITHUB_OUTPUT"
            echo "apk=XFiles-nightly.apk"                             >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}"                                    >> "$GITHUB_OUTPUT"
            echo "name=XFiles ${VERSION}"                             >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                                   >> "$GITHUB_OUTPUT"
            echo "apk=XFiles-${VERSION}.apk"                          >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"

          # Release notes are every commit since the newest version tag. Cutting a stable release
          # that tag is the previous version; refreshing the nightly it is the current stable — so
          # the list reads as "what this download adds on top of the last release" either way.
          # The version bump itself is dropped: the release already says which version it is.
          SINCE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$SINCE" ]; then RANGE="$SINCE..HEAD"; else RANGE=HEAD; fi
          LOG=$(git log --no-merges --reverse --pretty='format:- %s' "$RANGE" \
            | grep -v '^- Bump version to ' || true)
          {
            echo 'notes<<RELEASE_NOTES'
            if [ -n "$SINCE" ]; then
              echo "### Changes since ${SINCE}"
            else
              echo "### Changes"
            fi
            echo
            if [ -n "$LOG" ]; then
              echo "$LOG"
            else
              echo "- Rebuild only, no source changes."
            fi
            if [ -n "$SINCE" ]; then
              echo
              echo "[Full diff](${{ github.server_url }}/${{ github.repository }}/compare/${SINCE}...${{ github.sha }})"
            fi
            echo RELEASE_NOTES
          } >> "$GITHUB_OUTPUT"

      - name: Rename artifact
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.decide.outputs.apk }}"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.decide.outputs.name }}
          prerelease: ${{ steps.decide.outputs.prerelease }}
          body: |
            XFiles ${{ steps.decide.outputs.version }} · build ${{ steps.decide.outputs.build }} (${{ github.sha }}). Offline, open-source file manager — no network, no telemetry.

            ${{ steps.decide.outputs.notes }}
          files: ${{ steps.decide.outputs.apk }}
